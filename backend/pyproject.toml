[project]
name="ai-purchase-workflow"
version="0.1.0"
requires-python=">=3.12"
dependencies=["alembic>=1.14,<2","asyncpg>=0.30,<1","fastapi>=0.115,<1","langgraph>=1.0,<2","pydantic-settings>=2.7,<3","sqlalchemy[asyncio]>=2.0,<3","uvicorn[standard]>=0.34,<1"]

[dependency-groups]
dev=["httpx>=0.28,<1","pyright>=1.1.390","pytest>=8.3,<9","pytest-asyncio>=0.25,<1","pytest-cov>=6,<7","ruff>=0.9,<1"]

[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[tool.hatch.build.targets.wheel]
packages=["src/ai_purchase_workflow"]
[tool.ruff]
target-version="py312"
line-length=100
src=["src","tests"]
[tool.ruff.lint]
select=["E","F","I","B","UP","SIM","RUF"]
[tool.pyright]
pythonVersion="3.12"
typeCheckingMode="strict"
include=["src","tests"]
ignore=["reportMissingTypeStubs","reportUnknownMemberType"]
[tool.pytest.ini_options]
testpaths=["tests"]
asyncio_mode="auto"
[tool.coverage.run]
branch=true
source=["ai_purchase_workflow"]
[tool.coverage.report]
show_missing=true
fail_under=85
