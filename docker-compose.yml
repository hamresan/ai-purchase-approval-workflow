services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_purchase_workflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d ai_purchase_workflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
