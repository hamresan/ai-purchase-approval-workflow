services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_CONTAINER_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:-development-identity-signing-secret}
      IDENTITY_JWT_SIGNING_SECRET: ${IDENTITY_JWT_SIGNING_SECRET:-development-jwt-signing-secret-change-me}
      IDENTITY_ACCESS_TOKEN_MINUTES: ${IDENTITY_ACCESS_TOKEN_MINUTES:-15}
      WORKFLOW_MODEL_PROVIDER: ${WORKFLOW_MODEL_PROVIDER:-fake}
      WORKFLOW_MODEL_NAME: ${WORKFLOW_MODEL_NAME:-qwen3:8b}
      WORKFLOW_MODEL_BASE_URL: ${WORKFLOW_MODEL_BASE_URL:-}
      WORKFLOW_MODEL_TIMEOUT_SECONDS: ${WORKFLOW_MODEL_TIMEOUT_SECONDS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"      
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
