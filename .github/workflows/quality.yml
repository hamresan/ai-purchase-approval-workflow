name: quality
on:
  push:
    branches: ["main","stage-*"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ai_purchase_workflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_purchase_workflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_purchase_workflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd backend && uv sync --frozen --all-groups
      - run: cd frontend && npm ci
      - run: make check
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Start Docker E2E stack
        run: |
          docker compose up -d postgres
          docker compose build backend frontend
          docker compose run --rm backend uv run alembic upgrade head
          docker compose up -d backend frontend
        env:
          APP_ENV: test
          POSTGRES_DB: ai_purchase_workflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5632
          POSTGRES_CONTAINER_PORT: 5432
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_purchase_workflow
          FRONTEND_ORIGIN: http://localhost:5173
          BACKEND_PORT: 8000
          FRONTEND_PORT: 5173
          WORKFLOW_MODEL_PROVIDER: fake
      - name: Wait for Docker E2E stack
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null && \\
               curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs backend frontend
          exit 1
        env:
          POSTGRES_DB: ai_purchase_workflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5632
          POSTGRES_CONTAINER_PORT: 5432
      - name: Run Docker E2E
        run: cd frontend && npm run test:e2e
        env:
          E2E_EXTERNAL_SERVER: "true"
      - name: Print Docker E2E logs on failure
        if: failure()
        run: docker compose logs --no-color backend frontend
        env:
          POSTGRES_DB: ai_purchase_workflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5632
          POSTGRES_CONTAINER_PORT: 5432
      - name: Stop Docker E2E stack
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_DB: ai_purchase_workflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5632
          POSTGRES_CONTAINER_PORT: 5432

  clean-clone-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Configure clean-clone environment
        run: cp .env.example .env
      - name: Start clean-clone stack
        run: |
          docker compose up -d postgres
          docker compose build backend frontend
          docker compose run --rm backend uv run alembic upgrade head
          docker compose up -d backend frontend
      - name: Verify clean-clone health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null && \
               curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs backend frontend
          exit 1
      - name: Stop clean-clone stack
        if: always()
        run: docker compose down -v
