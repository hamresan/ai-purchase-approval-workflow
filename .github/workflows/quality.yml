name: quality
on:
  push:
    branches: ["main","stage-*"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ai_purchase_workflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_purchase_workflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_purchase_workflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd backend && uv sync --frozen --all-groups
      - run: cd frontend && npm ci
      - run: make check
      - run: cd backend && uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_purchase_workflow
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          cd backend
          nohup uv run uvicorn ai_purchase_workflow.presentation.app:create_app --factory \
            --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_purchase_workflow
      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then
              cat /tmp/backend.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
      - run: cd frontend && npm run test:e2e
